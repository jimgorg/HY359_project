<html>

    <body>
        <div class="container-fluid" style="padding-bottom: 200px;">
            <form id="myForm">
                <div id="booking">
                    
                
                    <h2>Κράτηση για φιλοξενία </h2>
                    
                    <label for='keeperid'>Pet Keepers Id</label><br>
                    <input type="number" id="keeper_id" name="keeper_id"><br><br>
                    
                    <label for='ownerid'>Pet Owner Id</label><br>
                    <input type="number" id="owner_id" name="owner_id"><br><br>
                    
                    <label for='petid'>Pet Id</label><br>
                    <input type="number" id="pet_id" name="pet_id"><br><br>
                    
                    <label for="fromDate">Αρχή φιλοξενίας:</label><br>
                    <input type="date" id="fromDate" name="fromDate" min="2023-12-01"><br><br>
                    
                    <label for="toDate">Τέλος φιλοξενίας </label><br>
                    <input type="date" id="toDate" name="toDate" min="2023-12-01"><br><br>
                </div>
                <div id="review">
                    <label for="addscore">Βαθμολογία :</label><br>
                    <label for="one">*</label>
                    <input type="radio" id="1" name="reviewScore" value="1"><br>
                    <label for="two">**</label>
                    <input type="radio" id="2" name="reviewScore" value="2"><br>
                    <label for="three">***</label>
                    <input type="radio" id="3" name="reviewScore" value="3"><br>
                    <label for="four">****</label>
                    <input type="radio" id="4" name="reviewScore" value="4"><br>
                    <label for="five">*****</label>
                    <input type="radio" id="5" name="reviewScore" value="5"><br>
                    <br><br>
                    <label for="addreview">Αξιολόγηση Φιλοξενίας :</label><br>
                    <textarea id="text" name="reviewText" rows="12" cols="50"></textarea><br><br>
                    <input type="button" id="reviewbutton" onclick='Review(); return false;' value="AddReview"><br><br>
                </div>
            
               
                <input type="button" id="makebooking"  onclick='MakeBookingPost(); return false;' value="MakeBooking"><br><br>
                <div id="edit"></div>
                <div  id="fini">
                    <input type="button" id="finishbutton"  onclick='finish(); return false;' value="Finish"><br>
                </div><br>            
            </form><br><br><br><br>  
            </div>
             <footer style="bottom:0;text-align: center;width: 100%; background-color: black ;color: white;  font-weight: bold;  position: fixed;height: 200px;opacity:0.9;" id="foot">
