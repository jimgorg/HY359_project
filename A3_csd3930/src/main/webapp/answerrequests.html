    <body >
        <header id="header"> <h1>Here you can see your pending requests for pet keeping and then accept or decline them. <br> </h1></header>
        <div class="container-fluid" style="padding-bottom: 300px;" >
<!--            <div class="center">-->
                
                
            <form id="myForm">
                <label for="username">Keeper's Username : </label><br>
                <input type="text" id="username" name="username" title="username"  ><br><br>
                
                <label for="owner_id">Owner ID to message : </label><br>
                <input type="text" id="owner_id" name="owner_id" title="owner_id"  ><br><br>

                <label for="booking_id">Booking ID  : </label><br>
                <input type="text" id="booking_id" name="booking_id" title="booking_id" ><br><br>
                
                <label for="messageowner">Message Owner :</label><br>
                <textarea id="messageowner" name="messageowner" rows="13" cols="38" style=" border-radius: 15px;border-bottom :3px solid; margin-top: 0.5%;background-color: transparent;font-family :Arial, Helvetica, sans-serif;font-weight: bold;font-size : 1.2rem"></textarea><br><br>
            </form>        
                
            <input type="button" id="viewrequests"  onclick="seePendingRequests(); return false;" value="View Pending Requests"><br><br>
            <input type="button" id="accept" value="Accept Request" onclick="AcceptRequest(); return false;" ><br><br>
            <input type="button" id="decline" value="Reject Request" onclick="DeclineRequest(); return false;" ><br><br>    
            <input type="button" id="statistics" value="View Finished Statistics" onclick="FinishedBookingsStats(); return false;"><br><br>
            <input type="button" id="reviews" value="View Finished Reviews" onclick="FinishedBookingsReviews(); return false;"><br><br>
            <input type="button" id="message" value="Message Owner" onclick="MessageOwner(); return false;"><br><br>
            
            
            
            
            
            
            <!--</div><br>-->
            <div id="message" style="padding-top: 88px;text-align: left;padding-bottom: 250px; ;position: absolute;" ></div><br>

            <div style="padding-top: 100px;text-align: left;padding-bottom: 250px; ;position: absolute;" id="edit"></div><br>
            <div id="forReviewTable" style="padding-top: 193px;text-align: left;padding-bottom: 250px; ;position: absolute;" ></div><br>
            <div id="reviewTable" style="padding-top: 200px;text-align: left;padding-bottom: 250px; ;position: absolute;" ></div>
        </div>
